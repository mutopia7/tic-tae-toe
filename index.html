
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Tic-Tac-Toe</title>
</head>
<body>

    <h1>Tic-Tac-Toe</h1>
    <section>
        <form action="">
            <label for="player1-name">Player 1 name(X):</label>
            <input type="text" id="player1-name" name="player1-name">         
            
            <label for="player2-name">Player 2 name(O):</label>
            <input type="text" id="player2-name" name="player2-name">
            
            <button type="submit" id="add">SUBMIT</button>
            
        </form>
    </section>
  <div id="game-board">
    
  </div>
  <p id="anounce"></p>
  <p id="result"></p>
  <button id="reset-button">Reset</button>
    

    <script type="module" src="main.js"></script>
</body>
</html>
